[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vitaisk"
version = "0.1.0"
description = "VitaisK — multi-parameter vital signs monitor for Linux system & network logs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VitaisK contributors" }]
keywords = ["monitoring", "logs", "security", "anomaly", "cli", "linux", "network", "pcap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0,<16",
    "pyyaml>=6.0",
    "psutil>=7.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
pcap = ["scapy>=2.5"]
dev  = ["pytest>=7", "pytest-cov", "ruff", "mypy", "build", "twine"]

[project.scripts]
vitaisk = "vitaisk.cli:main"

[project.urls]
Homepage = "https://github.com/Henr1sky/VitaisK-Metasploitable"
Issues   = "https://github.com/Henr1sky/VitaisK-Metasploitable/issues"

[tool.setuptools.packages.find]
include = ["vitaisk*", "legacy"]

[tool.setuptools.package-data]
vitaisk = ["rules/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"